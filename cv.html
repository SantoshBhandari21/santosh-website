<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CV | Santosh Bhandari</title>
    <meta
      name="description"
      content="Curriculum vitae of Santosh Bhandari. View it online or download the PDF."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CV | Santosh Bhandari" />
    <meta
      property="og:description"
      content="Curriculum vitae of Santosh Bhandari. View it online or download the PDF."
    />
    <meta property="og:url" content="https://santoshbhandari.info.np/cv.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js"></script>
  </head>
  <body>
    <div class="wrap">
      <aside id="side" aria-label="Profile"></aside>
      <main id="main">
        <section class="cv-intro" aria-labelledby="cv-title">
          <span class="section-kicker">Professional profile</span>
          <h2 id="cv-title">Curriculum Vitae</h2>
          <p class="lead">
            A quick overview of my education, experience, technical skills and
            development work.
          </p>
          <div class="btns">
            <a class="btn p" href="assets/Santosh Bhandari CV.pdf" download
              ><i class="fa-solid fa-download" aria-hidden="true"></i> Download CV</a
            >
            <a class="btn" href="assets/Santosh Bhandari CV.pdf" target="_blank" rel="noopener"
              ><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
              Open in new tab</a
            >
          </div>
        </section>
        <section class="cv-viewer" aria-labelledby="preview-title">
          <div class="cv-viewer-header">
            <div>
              <span class="section-kicker">Document preview</span>
              <h3 id="preview-title">Santosh Bhandari — CV</h3>
            </div>
            <i class="fa-solid fa-file-lines cv-viewer-icon" aria-hidden="true"></i>
          </div>
          <object
            class="cv-frame"
            data="assets/Santosh Bhandari CV.pdf"
            type="application/pdf"
            aria-label="Santosh Bhandari CV preview"
          >
            <div class="cv-fallback">
              <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
              <p>Your browser cannot display the PDF preview.</p>
              <a class="btn p" href="assets/Santosh Bhandari CV.pdf" download
                >Download the CV</a
              >
            </div>
          </object>
        </section>
      </main>
    </div>
    <footer id="footer"></footer>
  </body>
</html>
